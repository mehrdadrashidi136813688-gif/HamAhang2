plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("HAMAHANG_KEYSTORE_FILE")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD")

android {
    namespace 'com.hamahang.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hamahang.app'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.3'
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias 'hamahang'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
